# ---------------------------------------------------------------------------
# Volla Phone Quintus (algiz) - Linux 6.6 kernel, three variants
#
# Builds HelloVolla's MT6877 kernel (6.6.89) with Kleaf/Bazel and publishes all
# three variants side by side in a single GitHub release:
#
#   droidspaces-enforcing  DroidSpaces config + SYSVIPC kABI patch. SELinux
#                          untouched, i.e. enforcing. The safe default.
#   droidspaces-permissive Same, plus SELinux made permanently permissive.
#   stock-permissive       No DroidSpaces changes at all. Stock gki_defconfig,
#                          no kABI patch, only the permissive SELinux patch.
#
# "Permissive" is NOT selinux=0: selinuxfs stays mounted and the policy is
# still loaded (Android init requires both), but nothing is ever denied.
#
# No root solution is compiled into any variant by design - see README.md.
# ---------------------------------------------------------------------------
name: Build algiz kernels

on:
  workflow_dispatch:
    inputs:
      variants:
        description: "Which variants to build."
        type: choice
        default: all
        options:
          - all
          - droidspaces-enforcing
          - droidspaces-permissive
          - stock-permissive
      build_scope:
        description: "image = GKI Image only (default, kABI-safe). dist = full MediaTek dist build (all vendor modules, ~3-5h)"
        type: choice
        default: image
        options: [image, dist]
      mode:
        description: "MTK build variant. user = production (pure gki_defconfig). userdebug/eng add MTK debug configs (PANIC_ON_WARN, KMEMLEAK) - not for daily use."
        type: choice
        default: user
        options: [user, userdebug, eng]
      defconfig_overlays:
        description: "DEFCONFIG_OVERLAYS for the device-module side (space separated). Use the literal word none for an empty list."
        type: string
        default: mt6877_overlay.config
      boot_img_url:
        description: "Optional direct download URL of your STOCK boot.img. If set (or boot/boot.img is committed), a flashable boot.img is repacked."
        type: string
        default: ""
      disable_sandbox:
        description: "Add --config=local (disables the Bazel sandbox). Only needed if you hit sandbox errors."
        type: boolean
        default: false
      publish_release:
        description: "Publish a GitHub release with the AK3 zip and kernel images attached. Manual runs only; push-triggered runs never release."
        type: boolean
        default: true
  push:
    # branches: is required, not decoration. Without it a *tag* push also matches
    # this trigger, so creating a release tag starts a fresh ~25-minute build of
    # the commit the tag points at. The run's own github.token does not trigger
    # workflows, so the "Publish release" step below cannot loop, but a tag pushed
    # by a human or a PAT would.
    branches: [main]
    paths:
      - ".github/workflows/build-kernel.yml"
      - "patches/**"
      - "scripts/**"
      - "local_manifests/**"
      - "anykernel3/**"

permissions:
  # write is needed only by the "Publish release" step (gh release create/upload).
  # Nothing else in this workflow writes to the repository.
  contents: write

env:
  KERNEL_DIR: kernel-6.6
  DEVICE_MODULES_DIR: kernel_device_modules-6.6
  PROJECT: mgk_64_k66
  KERNEL_VERSION_NUM: "6.6"
  # kernel_device_modules-6.6/kernel/kleaf/_setup_env.sh derives this as
  # kernel-${KERNEL_VERSION_NUM}; bazel.WORKSPACE feeds it to
  # define_kleaf_workspace(common_kernel_package = "@//"+KERNEL_VERSION), so an
  # empty value silently breaks workspace evaluation.
  KERNEL_VERSION: kernel-6.6
  # kernel_device_modules-6.6/scripts/gki_checker.py needs a prebuilt AOSP
  # vmlinux under ../vendor/aosp_gki/ which is not part of the manifest.
  KLEAF_GKI_CHECKER: "no"
  BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN: "1"

jobs:
  # Turns the `variants` input into a matrix. A matrix cannot be filtered by an
  # input directly, so it is computed here and consumed via fromJSON below.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      count: ${{ steps.pick.outputs.count }}
    steps:
      - name: Decide which variants to build
        id: pick
        env:
          WANT: ${{ inputs.variants || 'all' }}
        run: |
          set -euo pipefail
          cat > /tmp/all.json <<'JSON'
          [
            {"variant":"droidspaces-enforcing","droidspaces":true,"permissive":false,
             "label":"DroidSpaces, SELinux enforcing"},
            {"variant":"droidspaces-permissive","droidspaces":true,"permissive":true,
             "label":"DroidSpaces, SELinux permissive"},
            {"variant":"stock-permissive","droidspaces":false,"permissive":true,
             "label":"Stock config, SELinux permissive"}
          ]
          JSON
          if [ "$WANT" = "all" ]; then
            sel=$(jq -c '.' /tmp/all.json)
          else
            sel=$(jq -c --arg v "$WANT" '[.[] | select(.variant == $v)]' /tmp/all.json)
          fi
          n=$(jq 'length' <<<"$sel")
          [ "$n" -gt 0 ] || { echo "::error::no variant matches '$WANT'"; exit 1; }
          echo "matrix={\"include\":$sel}" >> "$GITHUB_OUTPUT"
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "Building $n variant(s):"
          jq -r '.[] | "  " + .variant + "  (" + .label + ")"' <<<"$sel"

  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      # One variant failing must not cancel the others: a partial release is
      # more useful than none, and the release job tolerates missing variants.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      VARIANT: ${{ matrix.variant }}
      VARIANT_LABEL: ${{ matrix.label }}

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: recipe

      - name: Reclaim disk space and pick a workspace location
        run: |
          set -euo pipefail
          echo "::group::before"
          df -h / /mnt || true
          echo "::endgroup::"

          # The Kleaf/Bazel tree plus the sandbox needs ~45-60 GB. Drop the
          # pre-installed toolchains we do not use.
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/local/.ghcup \
            /opt/ghc \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules \
            /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true

          # Prefer the ephemeral /mnt disk: it is the biggest single filesystem
          # on a GitHub-hosted runner.
          pick=""
          for cand in /mnt "$RUNNER_TEMP" "$GITHUB_WORKSPACE/.."; do
            [ -d "$cand" ] || continue
            avail=$(df -BG --output=avail "$cand" 2>/dev/null | tail -1 | tr -dc '0-9')
            [ -n "${avail:-}" ] || continue
            echo "candidate $cand -> ${avail} GiB free"
            if [ "$avail" -ge 40 ]; then pick="$cand"; break; fi
          done
          [ -n "$pick" ] || { echo "::error::no filesystem with >=40 GiB free"; df -h; exit 1; }

          ws="$pick/algiz"
          sudo mkdir -p "$ws"
          sudo chown "$(id -u):$(id -g)" "$ws"
          echo "WS=$ws" >> "$GITHUB_ENV"
          echo "Workspace: $ws"

          echo "::group::after"
          df -h / /mnt || true
          echo "::endgroup::"
      - name: Install host build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # Kleaf brings its own hermetic clang/python3/build-tools; these are
          # only needed by repo, the patch step and the packaging steps.
          sudo apt-get install -y --no-install-recommends \
            git curl python3 rsync zip unzip lz4 zstd bc bison flex \
            patch diffutils libssl-dev ca-certificates
          repo_bin="$HOME/.bin"
          mkdir -p "$repo_bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$repo_bin/repo"
          chmod a+x "$repo_bin/repo"
          echo "$repo_bin" >> "$GITHUB_PATH"

      - name: Sync kernel sources (repo)
        run: |
          set -euo pipefail
          bash recipe/scripts/setup-workspace.sh "$WS" recipe/local_manifests/algiz.xml

      - name: Apply the DroidSpaces SYSVIPC kABI patch
        if: matrix.droidspaces
        working-directory: ${{ env.WS }}
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"

          # Guard: the padding-slot rewrite only works if slots 6/7/8 are still
          # free in this tree. If ANDROID_KABI_USE(6, ... already exists, some
          # other change took the slot and the patch must be re-based.
          if grep -q 'ANDROID_KABI_USE(6,' include/linux/sched.h; then
            echo "::error::ANDROID_KABI slot 6 is already used in include/linux/sched.h"
            exit 1
          fi
          for slot in 6 7 8; do
            grep -q "ANDROID_KABI_RESERVE(${slot});" include/linux/sched.h \
              || { echo "::error::ANDROID_KABI_RESERVE(${slot}) not found in task_struct"; exit 1; }
          done

          applied=""
          # 6_7_8 is the variant matching this tree (slots 6/7/8 free). 3_4_5 is
          # the working fallback. 1_2_3 is shipped for completeness but hunk 2
          # does not apply to 6.6.89 - it is tried last on purpose.
          for p in 001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch \
                   001.GKI-below-6.12-fix_sysvipc_kabi_3_4_5.patch \
                   001.GKI-below-6.12-fix_sysvipc_kabi_1_2_3.patch; do
            pf="$GITHUB_WORKSPACE/recipe/patches/$p"
            [ -f "$pf" ] || continue
            # Default fuzz (2) is required: hunk 1 lands at offset -2 and hunk 2
            # at offset 8 in 6.6.89.
            if patch -p1 --dry-run --silent < "$pf" >/dev/null 2>&1; then
              patch -p1 < "$pf"
              applied="$p"
              break
            fi
            echo "skip (does not apply): $p"
          done
          [ -n "$applied" ] || { echo "::error::no SYSVIPC kABI patch applied"; exit 1; }
          echo "Applied: $applied"

          echo "::group::resulting task_struct hunks"
          grep -n 'sysvsem\|sysvshm\|ANDROID_KABI_USE(6\|_ANDROID_KABI_REPLACE' include/linux/sched.h
          echo "::endgroup::"

          # The commented-out members must be gone from the CONFIG_SYSVIPC block
          # near the top of task_struct, or offsets shift and vendor modules break.
          if grep -qE '^\s+struct sysv_(sem|shm)\s+sysv(sem|shm);' include/linux/sched.h; then
            echo "::error::sysvsem/sysvshm are still live task_struct members"
            exit 1
          fi

      - name: Apply the DroidSpaces defconfig fragment
        if: matrix.droidspaces
        working-directory: ${{ env.WS }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/recipe/scripts/apply-droidspaces-config.sh" \
            "$KERNEL_DIR/arch/arm64/configs/gki_defconfig"

      - name: Make SELinux permanently permissive
        if: matrix.permissive
        working-directory: ${{ env.WS }}
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"
          h=security/selinux/include/security.h
          pf="$GITHUB_WORKSPACE/recipe/patches/002.selinux-permanently-permissive.patch"

          # CONFIG_SECURITY_SELINUX_DEVELOP=y is what puts the real
          # READ_ONCE(selinux_state.enforcing) body in scope. Without it the
          # #else branch (return true) is compiled and the patch would apply to
          # dead code, silently producing an enforcing kernel.
          grep -qx 'CONFIG_SECURITY_SELINUX_DEVELOP=y' arch/arm64/configs/gki_defconfig \
            || grep -q 'default y' security/selinux/Kconfig \
            || { echo "::error::SECURITY_SELINUX_DEVELOP is not enabled; the patch would be dead code"; exit 1; }

          patch -p1 --dry-run --silent < "$pf" \
            || { echo "::error::002.selinux-permanently-permissive.patch does not apply to $h"; exit 1; }
          patch -p1 < "$pf"

          echo "::group::enforcing_enabled() after patching"
          sed -n '/^#ifdef CONFIG_SECURITY_SELINUX_DEVELOP$/,/^#else$/p' "$h"
          echo "::endgroup::"

          # Assert the outcome rather than trusting patch's exit code: the
          # DEVELOP branch must now return false, and enforcing_set() must be
          # left alone so /sys/fs/selinux/enforce stays writable.
          awk '/^#ifdef CONFIG_SECURITY_SELINUX_DEVELOP$/{f=1} f{print} /^#else$/{if(f)exit}' "$h" \
            > /tmp/develop-branch.txt
          grep -q 'return false;' /tmp/develop-branch.txt \
            || { echo "::error::enforcing_enabled() does not return false after patching"; exit 1; }
          grep -q 'WRITE_ONCE(selinux_state.enforcing, value);' /tmp/develop-branch.txt \
            || { echo "::error::enforcing_set() was altered; setenforce would stop working"; exit 1; }
          echo "SELinux is now permanently permissive (selinuxfs and policy load untouched)."

      - name: Neutralize check_defconfig on the GKI-side build config
        if: matrix.droidspaces
        working-directory: ${{ env.WS }}
        run: |
          set -euo pipefail
          # Only needed when gki_defconfig has been edited. The stock variant
          # leaves it byte-identical, so `make savedefconfig` still matches and
          # check_defconfig passes on its own - leave the vendor tree alone there.
          #
          # For MODE=user, define_mgk() remaps build_variant to "ack", so the
          # guard `gki_mixed_build or (build_variant != "ack")` in
          # _mgk_build_config_impl is false and the generated GKI-side build
          # config never overrides POST_DEFCONFIG_CMDS. build.config.gki's
          # POST_DEFCONFIG_CMDS="check_defconfig" therefore survives and would
          # fail the build, because `make savedefconfig` re-sorts our added
          # symbols into Kconfig order and no longer matches the file byte for
          # byte. MTK already blanks this for every other variant; do the same
          # here so gki_defconfig stays editable.
          f="$KERNEL_DIR/build.config.gki"
          cp -f "$f" "$f.orig"
          sed -i 's|^POST_DEFCONFIG_CMDS="check_defconfig"$|POST_DEFCONFIG_CMDS=""|' "$f"
          grep -q '^POST_DEFCONFIG_CMDS=""$' "$f" \
            || { echo "::error::failed to blank POST_DEFCONFIG_CMDS in $f"; cat "$f"; exit 1; }
          diff -u "$f.orig" "$f" || true
          rm -f "$f.orig"

      - name: Reconcile the define_mgk() call with the algiz mgk.bzl signature
        working-directory: ${{ env.WS }}
        run: |
          set -euo pipefail
          # kernel_device_modules-6.6 @ volla-16.0 is out of sync with
          # build/bazel_mgk_rules @ volla-16.0-algiz: BUILD.bazel still passes
          # `dtb_files = ["mt6899.dtb"]` (a different SoC), but the algiz
          # mgk.bzl dropped DTB handling entirely - define_mgk() ends at
          # symbol_list and there is no dtb/dtstree code path left to consume
          # it. Bazel therefore fails analysis with
          #   define_mgk() got unexpected keyword argument: dtb_files
          # and never declares mgk_64_k66_kernel_aarch64.<mode>.
          # The ansuz branches keep `dtb_files = None` in the signature, which
          # confirms BUILD.bazel is the stale side here.
          mgk="build/bazel_mgk_rules/mgk.bzl"
          f="$DEVICE_MODULES_DIR/BUILD.bazel"

          sig() {
            awk '/^def define_mgk\(/{f=1} f{print} f && /\):[[:space:]]*$/{exit}' "$mgk" \
              | sed -n 's/^[[:space:]]*\([a-z_][a-z_0-9]*\)[[:space:]]*[,=:)].*/\1/p' \
              | sort -u
          }
          kwargs() {
            awk '/^define_mgk\(/{f=1;next} /^\)/{f=0} f' "$f" \
              | sed -n 's/^[[:space:]]*\([a-z_][a-z_0-9]*\)[[:space:]]*=.*/\1/p' \
              | sort -u
          }

          sig > /tmp/mgk.sig
          kwargs > /tmp/mgk.kw
          echo "define_mgk() accepts $(wc -l < /tmp/mgk.sig) params; call passes $(wc -l < /tmp/mgk.kw) kwargs"

          extra="$(comm -23 /tmp/mgk.kw /tmp/mgk.sig || true)"
          if [ -z "$extra" ]; then
            echo "No stale kwargs - the trees agree, nothing to do."
            exit 0
          fi
          echo "Stale kwargs in $f:"; printf '  %s\n' $extra

          # Only single-line `name = value,` kwargs can be removed safely.
          for k in $extra; do
            case "$k" in
              dtb_files) ;;
              *) echo "::error::unexpected stale kwarg '$k' - refusing to guess; inspect $f"; exit 1 ;;
            esac
            n="$(grep -c "^[[:space:]]*${k}[[:space:]]*=.*,[[:space:]]*$" "$f" || true)"
            [ "$n" = "1" ] || { echo "::error::'$k' is not a single-line kwarg ($n matches)"; exit 1; }
            grep -n "^[[:space:]]*${k}[[:space:]]*=" "$f"
            sed -i "/^[[:space:]]*${k}[[:space:]]*=.*,[[:space:]]*$/d" "$f"
            echo "removed: $k"
          done

          # The call must still be well formed and free of unknown kwargs.
          kwargs > /tmp/mgk.kw2
          left="$(comm -23 /tmp/mgk.kw2 /tmp/mgk.sig || true)"
          [ -z "$left" ] || { echo "::error::stale kwargs remain: $left"; exit 1; }
          tail -4 "$f"
          grep -q '^)' "$f" || { echo "::error::define_mgk() call is no longer closed"; exit 1; }

      - name: Build
        working-directory: ${{ env.WS }}
        env:
          MODE: ${{ inputs.mode || 'user' }}
          BUILD_SCOPE: ${{ inputs.build_scope || 'image' }}
          DEFCONFIG_OVERLAYS: ${{ inputs.defconfig_overlays || 'mt6877_overlay.config' }}
          SANDBOX_OFF: ${{ inputs.disable_sandbox && '1' || '' }}
        run: |
          set -euo pipefail

          # "none" is the escape hatch for an empty overlay list: an empty
          # workflow input would otherwise fall back to the default above.
          [ "$DEFCONFIG_OVERLAYS" = "none" ] && DEFCONFIG_OVERLAYS=""

          # These are read by key_value_repo() during WORKSPACE evaluation,
          # i.e. before any target is analysed. They must be exported here,
          # not inside a later Bazel invocation.
          export KERNEL_VERSION DEFCONFIG_OVERLAYS
          export SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH:-$(date -u +%s)}"
          export PATH="$PWD/prebuilts/jdk/jdk11/linux-x86/bin:$PATH"

          OUT_DIR="$PWD/out"
          mkdir -p "$OUT_DIR"

          startup=(
            "--output_user_root=$OUT_DIR"
            "--output_base=$OUT_DIR/bazel/output_user_root/output_base"
          )
          args=(
            --experimental_writable_outputs
            --noenable_bzlmod
            # //build/bazel_mgk_rules:kernel_version defaults to 6.1; every
            # select() on kernel_version_6.6 in mgk.bzl depends on this.
            "--//build/bazel_mgk_rules:kernel_version=$KERNEL_VERSION_NUM"
            --nokmi_symbol_list_violations_check
          )
          [ -n "$SANDBOX_OFF" ] && args+=(--config=local)

          echo "MODE=$MODE  BUILD_SCOPE=$BUILD_SCOPE  DEFCONFIG_OVERLAYS=$DEFCONFIG_OVERLAYS"

          if [ "$BUILD_SCOPE" = "dist" ]; then
            # Full MediaTek build: GKI image + every in-tree and vendor module,
            # collected into out/dist by copy_to_dist_dir.
            target="//$DEVICE_MODULES_DIR:${PROJECT}_customer_modules_install.$MODE"
            dist="//$DEVICE_MODULES_DIR:${PROJECT}_customer_dist.$MODE"
            tools/bazel "${startup[@]}" build "${args[@]}" "$target"
            tools/bazel "${startup[@]}" run   "${args[@]}" "$dist" -- --dist_dir="$OUT_DIR/dist"
          else
            # Kernel image only: the GKI-side kernel_build. Produces
            # DEFAULT_GKI_OUTS (Image, Image.lz4, Image.gz, vmlinux, System.map,
            # ...) plus the standard GKI in-tree modules via
            # module_implicit_outs. Stock vendor_dlkm modules keep loading
            # because the patch is padding-slot based.
            target="//$DEVICE_MODULES_DIR:${PROJECT}_kernel_aarch64.$MODE"
            tools/bazel "${startup[@]}" build "${args[@]}" "$target"
          fi
      - name: Collect kernel artifacts
        working-directory: ${{ env.WS }}
        env:
          MODE: ${{ inputs.mode || 'user' }}
          BUILD_SCOPE: ${{ inputs.build_scope || 'image' }}
        run: |
          set -euo pipefail
          OUT_DIR="$PWD/out"
          art="$PWD/artifacts"
          mkdir -p "$art"

          tgt="${PROJECT}_kernel_aarch64.$MODE"

          # kernel_build declares its outs as
          #   <target-name>/<out>  under bazel-bin/<package>/
          # Prefer the dist directory (populated only for build_scope=dist),
          # then the bazel-bin convenience symlink, then the execroot bin dirs
          # (the symlink is not guaranteed once --output_base is overridden).
          searchdirs=(
            "$OUT_DIR/dist"
            "$PWD/bazel-bin/$DEVICE_MODULES_DIR/$tgt"
          )
          while IFS= read -r d; do searchdirs+=("$d"); done < <(
            find "$OUT_DIR/bazel/output_user_root/output_base/execroot" \
              -maxdepth 5 -type d -name bin 2>/dev/null
          )

          srcdir=""
          for cand in "${searchdirs[@]}"; do
            [ -e "$cand" ] || continue
            found="$(find -L "$cand" -maxdepth 4 -type f -name Image 2>/dev/null | head -1 || true)"
            if [ -n "$found" ]; then srcdir="$(dirname "$found")"; break; fi
          done
          [ -n "$srcdir" ] || { echo "::error::no Image found; searched dist/, bazel-bin/ and the execroot"; exit 1; }
          echo "Artifacts from: $srcdir"

          for f in Image Image.lz4 Image.gz System.map vmlinux.symvers \
                   modules.builtin modules.builtin.modinfo; do
            [ -f "$srcdir/$f" ] && cp -f "$srcdir/$f" "$art/"
          done
          # vmlinux is ~500 MB uncompressed; keep it, but compressed.
          if [ -f "$srcdir/vmlinux" ]; then
            zstd -q -T0 -19 -o "$art/vmlinux.zst" "$srcdir/vmlinux" 2>/dev/null \
              || zstd -q -T0 -o "$art/vmlinux.zst" "$srcdir/vmlinux"
          fi
          [ -f "$art/Image" ] || { echo "::error::Image missing after copy"; exit 1; }

          if [ "$BUILD_SCOPE" = "dist" ]; then
            mkdir -p "$art/modules"
            # Vendor + in-tree modules, flattened, for manual inspection.
            find -L "$OUT_DIR/dist" -type f -name '*.ko' -exec cp -f {} "$art/modules/" \; 2>/dev/null || true
            echo "modules collected: $(ls -1 "$art/modules" 2>/dev/null | wc -l)"
          fi

          echo "SRCDIR=$srcdir" >> "$GITHUB_ENV"
          echo "ART=$art" >> "$GITHUB_ENV"
          echo "::group::artifacts"
          ls -lh "$art"
          echo "::endgroup::"

      - name: Locate and archive the built .config
        working-directory: ${{ env.WS }}
        env:
          MODE: ${{ inputs.mode || 'user' }}
        run: |
          set -euo pipefail
          OUT_DIR="$PWD/out"

          cfg=""
          # kernel_config rsyncs the resolved .config into its out_dir.
          cfg="$(find -L "$OUT_DIR/bazel/output_user_root/output_base/execroot" \
                   -path "*${PROJECT}_kernel_aarch64.${MODE}_config/out_dir/.config" \
                   2>/dev/null | head -1 || true)"
          if [ -z "$cfg" ] && [ -f "$SRCDIR/vmlinux" ]; then
            # CONFIG_IKCONFIG=y in gki_defconfig, so the config is embedded in
            # the image itself and can always be recovered.
            "$KERNEL_DIR/scripts/extract-ikconfig" "$SRCDIR/vmlinux" > /tmp/built.config
            cfg=/tmp/built.config
          fi
          [ -n "$cfg" ] || { echo "::error::could not locate the built .config"; exit 1; }
          echo "Using .config: $cfg"
          cp -f "$cfg" "$ART/build.config.resolved"
          # Downstream verification steps read this instead of repeating the
          # search above; the file is a release asset either way.
          echo "CFG=$ART/build.config.resolved" >> "$GITHUB_ENV"

      - name: Verify the DroidSpaces options
        # Skipped for stock-permissive: none of these symbols were touched
        # there, several are genuinely absent from the stock defconfig, and
        # failing on that would fail the variant by design.
        if: matrix.droidspaces
        working-directory: ${{ env.WS }}
        run: |
          set -euo pipefail
          cfg="$CFG"

          fail=0
          echo "== DroidSpaces GKI-exclusive options =="
          # NOTE: the DroidSpaces docs list NETFILTER_XT_TARGET_REJECT, which is
          # not a Kconfig symbol in Linux 6.6 (no net/netfilter/xt_REJECT.c
          # either). The real per-family symbols are checked instead; both are
          # already =y in the stock algiz gki_defconfig.
          for s in SYSVIPC POSIX_MQUEUE IPC_NS PID_NS DEVTMPFS \
                   NETFILTER_XT_MATCH_ADDRTYPE USER_NS \
                   IP_NF_TARGET_REJECT IP6_NF_TARGET_REJECT \
                   NETFILTER_XT_TARGET_LOG \
                   NETFILTER_XT_MATCH_RECENT \
                   IP_SET IP_SET_HASH_IP IP_SET_HASH_NET NETFILTER_XT_SET \
                   TMPFS_POSIX_ACL TMPFS_XATTR; do
            v="$(sed -n "s/^CONFIG_${s}=//p" "$cfg" | head -1)"
            case "$v" in
              y) printf '  ok    CONFIG_%s=y\n' "$s" ;;
              m) printf '  ok    CONFIG_%s=m (module, loadable)\n' "$s" ;;
              *) printf '  FAIL  CONFIG_%s not enabled\n' "$s"; fail=1 ;;
            esac
          done

          # Guard against the docs' spelling silently coming back: if a future
          # kernel really does grow NETFILTER_XT_TARGET_REJECT, say so instead
          # of failing.
          if grep -q '^CONFIG_NETFILTER_XT_TARGET_REJECT=' "$cfg"; then
            echo "  note  CONFIG_NETFILTER_XT_TARGET_REJECT exists in this tree after all"
          fi

          echo "== DroidSpaces fatal-if-missing options =="
          for s in NAMESPACES UTS_NS IPC_NS PID_NS DEVTMPFS; do
            if grep -qx "CONFIG_${s}=y" "$cfg"; then
              printf '  ok    CONFIG_%s=y\n' "$s"
            else
              printf '  FAIL  CONFIG_%s missing (DroidSpaces check will refuse to run)\n' "$s"
              fail=1
            fi
          done

          # CGROUP_DEVICE: the docs call it fatal, but only in their non-GKI
          # list. DroidSpaces' runtime check never probes it; devices_cgrp_subsys
          # is cgroup-v1 only (.legacy_cftypes, security/device_cgroup.c); and
          # enabling it inserts a SUBSYS(devices) entry in
          # include/linux/cgroup_subsys.h, shifting every later cgroup_subsys_id
          # - a kABI break for prebuilt vendor modules. Reported, never fatal.
          if grep -qx "CONFIG_CGROUP_DEVICE=y" "$cfg"; then
            echo "  note  CONFIG_CGROUP_DEVICE=y (from the vendor config)"
          else
            echo "  note  CONFIG_CGROUP_DEVICE not set - intentional, see comment"
          fi

          echo "== recommended by the DroidSpaces runtime check =="
          for s in EPOLL SIGNALFD BLK_DEV_LOOP EXT4_FS CGROUPS CGROUP_PIDS \
                   CGROUP_SCHED MEMCG SECCOMP SECCOMP_FILTER OVERLAY_FS \
                   FUSE_FS NET_NS BRIDGE VETH IPV6 KEYS; do
            v="$(sed -n "s/^CONFIG_${s}=//p" "$cfg" | head -1)"
            if [ -n "$v" ]; then
              printf '  have   CONFIG_%s=%s\n' "$s" "$v"
            else
              printf '  MISS   CONFIG_%s (optional/recommended only)\n' "$s"
            fi
          done

          echo "== kABI / module-loading guarantees =="
          for s in MODVERSIONS MODULE_SIG_PROTECT; do
            if grep -qx "CONFIG_${s}=y" "$cfg"; then
              printf '  ok    CONFIG_%s=y\n' "$s"
            else
              printf '  WARN  CONFIG_%s not set - stock vendor modules may be rejected\n' "$s"
            fi
          done
          grep -m1 '^CONFIG_LOCALVERSION=' "$cfg" || true

          [ "$fail" -eq 0 ] || { echo "::error::the built .config does not satisfy DroidSpaces"; exit 1; }

      - name: Verify the SELinux and root-related options
        working-directory: ${{ env.WS }}
        env:
          PERMISSIVE: ${{ matrix.permissive }}
        run: |
          set -euo pipefail
          cfg="$CFG"
          fail=0

          # CONFIG_SECURITY_SELINUX_DEVELOP is the branch the permissive patch
          # edits. Without it the compiler takes the #else path (return true)
          # and the patch is dead code, so this is a hard requirement for the
          # permissive variants and worth reporting for the enforcing one.
          if grep -qx 'CONFIG_SECURITY_SELINUX_DEVELOP=y' "$cfg"; then
            echo "  ok    CONFIG_SECURITY_SELINUX_DEVELOP=y (the patched branch is the compiled one)"
          elif [ "$PERMISSIVE" = "true" ]; then
            echo "  FAIL  CONFIG_SECURITY_SELINUX_DEVELOP is not =y - the permissive patch is dead code"
            fail=1
          else
            echo "  note  CONFIG_SECURITY_SELINUX_DEVELOP not =y"
          fi

          # enforcing_enabled() is a static inline in a header, so the result is
          # not visible in .config at all. Prove it from vmlinux instead: with
          # `return false` the only remaining reader of selinux_state.enforcing
          # is selinuxfs/enforcing_set, and selinux_enforcing_boot-style strings
          # are unaffected. The definitive check is the source assertion in the
          # patch step; this one confirms the built image agrees.
          if [ "$PERMISSIVE" = "true" ]; then
            echo "  info  SELinux is permissive by patch (asserted at source level before the build)"
          else
            echo "  info  SELinux left stock (enforcing)"
          fi

          echo "== KernelSU LKM prerequisites (root is added by you, not by this kernel) =="
          for s in KPROBES KALLSYMS_ALL MODULES MODULE_UNLOAD; do
            if grep -qx "CONFIG_${s}=y" "$cfg"; then
              printf '  ok    CONFIG_%s=y\n' "$s"
            else
              printf '  WARN  CONFIG_%s not =y - KernelSU LKM mode may not work\n' "$s"
            fi
          done
          if grep -qx 'CONFIG_MODULE_SIG_FORCE=y' "$cfg"; then
            echo "  WARN  CONFIG_MODULE_SIG_FORCE=y - unsigned kernelsu.ko would be rejected"
          else
            echo "  ok    CONFIG_MODULE_SIG_FORCE not set - unsigned modules can load"
          fi

          echo "== kABI / module-loading guarantees =="
          for s in MODVERSIONS MODULE_SIG_PROTECT; do
            if grep -qx "CONFIG_${s}=y" "$cfg"; then
              printf '  ok    CONFIG_%s=y\n' "$s"
            else
              printf '  WARN  CONFIG_%s not set - stock vendor modules may be rejected\n' "$s"
            fi
          done
          grep -m1 '^CONFIG_LOCALVERSION=' "$cfg" || true

          [ "$fail" -eq 0 ] || { echo "::error::the built .config does not match the requested variant"; exit 1; }
      - name: Package the AnyKernel3 zip
        working-directory: ${{ env.WS }}
        env:
          MODE: ${{ inputs.mode || 'user' }}
          BUILD_SCOPE: ${{ inputs.build_scope || 'image' }}
          DROIDSPACES: ${{ matrix.droidspaces }}
          PERMISSIVE: ${{ matrix.permissive }}
        run: |
          set -euo pipefail
          ak="$PWD/ak3"
          rm -rf "$ak"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 "$ak"
          rm -rf "$ak/.git" "$ak/.github" "$ak/README.md" \
                 "$ak/ramdisk" "$ak/patch" "$ak/modules"
          # Recreate the placeholder dirs AK3 expects to exist.
          mkdir -p "$ak/ramdisk" "$ak/patch" "$ak/modules"
          touch "$ak/ramdisk/.gitkeep" "$ak/patch/.gitkeep" "$ak/modules/.gitkeep"

          cp -f "$GITHUB_WORKSPACE/recipe/anykernel3/anykernel.sh" "$ak/anykernel.sh"

          # Make the flashed zip say which variant it is. AK3 prints
          # kernel.string during install, so this is the only place the user
          # sees it if the three zips get renamed or mixed up.
          sed -i "s|^kernel\.string=.*|kernel.string=Volla Quintus (algiz) ${VARIANT_LABEL}|" \
            "$ak/anykernel.sh"
          grep '^kernel.string=' "$ak/anykernel.sh"

          # ak3-core.sh flash_boot() picks the first match from a fixed list
          # (zImage..., Image, ..., Image.gz, ..., Image.lz4). Ship the raw
          # Image only, so there is no ambiguity about which one gets flashed.
          cp -f "$ART/Image" "$ak/Image"

          sver="$(sed -n 's/^CONFIG_LOCALVERSION="\(.*\)"$/\1/p' \
                  "$KERNEL_DIR/arch/arm64/configs/gki_defconfig" | head -1)"
          kver="$(sed -n 's/^VERSION = //p' "$KERNEL_DIR/Makefile" | head -1).$(sed -n 's/^PATCHLEVEL = //p' "$KERNEL_DIR/Makefile" | head -1).$(sed -n 's/^SUBLEVEL = //p' "$KERNEL_DIR/Makefile" | head -1)"
          zipname="AK3-algiz-${VARIANT}-${kver}${sver}-${MODE}-$(date -u +%Y%m%d).zip"

          ( cd "$ak" && zip -r9 "$ART/$zipname" . -x '.git*' >/dev/null )
          echo "ZIPNAME=$zipname" >> "$GITHUB_ENV"
          echo "KVER=${kver}${sver}" >> "$GITHUB_ENV"
          ls -lh "$ART/$zipname"

          # The release job runs in a different job, so $GITHUB_ENV does not
          # reach it. Everything it needs to describe this variant travels
          # inside the artifact instead.
          cat > "$ART/variant.json" <<JSON
          {
            "variant": "${VARIANT}",
            "label": "${VARIANT_LABEL}",
            "droidspaces": ${DROIDSPACES},
            "permissive": ${PERMISSIVE},
            "kver": "${kver}${sver}",
            "zipname": "${zipname}",
            "mode": "${MODE}",
            "scope": "${BUILD_SCOPE}"
          }
          JSON
          # Fail here rather than in the release job if the heredoc ever drifts.
          jq -e . "$ART/variant.json" > /dev/null

      - name: Repack boot.img (only when a stock boot.img is supplied)
        working-directory: ${{ env.WS }}
        env:
          BOOT_IMG_URL: ${{ inputs.boot_img_url }}
        run: |
          set -euo pipefail
          stock=""
          if [ -f "$GITHUB_WORKSPACE/recipe/boot/boot.img" ]; then
            stock="$GITHUB_WORKSPACE/recipe/boot/boot.img"
            echo "Using committed boot/boot.img"
          elif [ -n "${BOOT_IMG_URL:-}" ]; then
            echo "Downloading stock boot.img"
            curl -fsSL "$BOOT_IMG_URL" -o /tmp/stock-boot.img
            stock=/tmp/stock-boot.img
          else
            echo "No stock boot.img supplied - skipping boot.img repack."
            echo "Flash the AnyKernel3 zip instead, or re-run with boot_img_url set."
            exit 0
          fi

          # Sanity check: Android boot images start with "ANDROID!".
          magic="$(head -c 8 "$stock" | tr -d '\0')"
          [ "$magic" = "ANDROID!" ] || {
            echo "::error::$stock is not an Android boot image (magic: '$magic')"
            exit 1
          }

          py="$PWD/prebuilts/build-tools/path/linux-x86/python3"
          [ -x "$py" ] || py="$(command -v python3)"
          work=/tmp/bootrepack
          rm -rf "$work"; mkdir -p "$work/unpacked"

          # unpack_bootimg --format=mkbootimg emits the exact argument list that
          # reproduces the input, so the repack only differs by the kernel.
          "$py" "$PWD/tools/mkbootimg/unpack_bootimg.py" \
            --boot_img "$stock" --out "$work/unpacked" \
            --format=mkbootimg -0 > "$work/args0"

          echo "::group::stock boot.img layout"
          "$py" "$PWD/tools/mkbootimg/unpack_bootimg.py" --boot_img "$stock" --format=info || true
          echo "::endgroup::"

          # mapfile -d '' treats the NUL as a *terminator*, not a separator, so a
          # stream of N NUL-terminated arguments yields exactly N elements. There
          # is no trailing empty element to drop, and dropping one anyway is what
          # broke the first attempt at this step: for header_version >= 3,
          # unpack_bootimg emits --cmdline *last*, algiz's stock cmdline is empty,
          # so the "cleanup" deleted that legitimately-empty value and left
          # mkbootimg with a dangling --cmdline ("expected one argument").
          mapfile -d '' MKBOOTIMG_ARGS < "$work/args0"
          printf 'unpack_bootimg emitted %d argument(s):\n' "${#MKBOOTIMG_ARGS[@]}"
          printf '  [%s]\n' "${MKBOOTIMG_ARGS[@]}"

          # Match the stock image's kernel container. algiz ships a gzip-compressed
          # kernel (byte 0x1000 of the stock boot.img is 1f 8b 08, 14554925 B). A
          # raw 36 MB Image also boots, but it leaves far less slack inside the
          # 40 MB boot partition once avbtool pads to partition_size below.
          if [ -f "$ART/Image.gz" ]; then
            payload="$ART/Image.gz"
          else
            payload="$ART/Image"
          fi
          cp -f "$payload" "$work/kernel-payload"
          echo "kernel payload: ${payload##*/} ($(stat -c %s "$work/kernel-payload") bytes)"

          # Replace the --kernel payload with ours, keeping every other field.
          replaced=0
          for i in "${!MKBOOTIMG_ARGS[@]}"; do
            if [ "${MKBOOTIMG_ARGS[$i]}" = "--kernel" ]; then
              MKBOOTIMG_ARGS[$((i + 1))]="$work/kernel-payload"
              replaced=1
              break
            fi
          done
          [ "$replaced" -eq 1 ] || {
            echo "::error::unpack_bootimg emitted no --kernel argument"
            exit 1
          }

          "$py" "$PWD/tools/mkbootimg/mkbootimg.py" \
            "${MKBOOTIMG_ARGS[@]}" --output "$work/boot-new.img"

          # Re-add the AVB hash footer if the stock image had one. avbtool needs
          # room for the footer and vbmeta blob on top of the payload, so compare
          # against --calc_max_image_size rather than the raw partition size.
          #
          # The footer is written with algorithm NONE: re-signing would need the
          # OEM's private AVB key, which nobody outside Volla has. The stock image
          # carries a SHA256_RSA2048 signature; the repack cannot. That is fine on
          # an unlocked bootloader (which flashing a custom kernel already
          # requires) but the image will not pass locked-bootloader verification.
          avb="$PWD/prebuilts/kernel-build-tools/linux-x86/bin/avbtool"
          if [ -x "$avb" ] && "$avb" info_image --image "$stock" >/dev/null 2>&1; then
            psize=$(stat -c %s "$stock")
            maxsize=$("$avb" add_hash_footer --partition_name boot \
                        --partition_size "$psize" --calc_max_image_size)
            newsize=$(stat -c %s "$work/boot-new.img")
            echo "repacked $newsize B; max payload $maxsize B; partition $psize B"
            if [ "$newsize" -gt "$maxsize" ]; then
              echo "::error::repacked boot.img ($newsize B) does not fit the boot partition (max payload $maxsize B of $psize B)"
              exit 1
            fi
            "$avb" add_hash_footer --image "$work/boot-new.img" \
              --partition_name boot --partition_size "$psize"
            echo "AVB hash footer added (partition_size=$psize, unsigned)"
          else
            echo "Stock image has no AVB footer (or avbtool unavailable) - leaving as is."
          fi

          cp -f "$work/boot-new.img" "$ART/boot.img"
          ls -lh "$ART/boot.img"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          # One artifact per variant. The release job globs `algiz-kernel-*` and
          # relies on the trailing variant name to label and rename the assets.
          name: algiz-kernel-${{ github.run_number }}-${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ env.WS }}/artifacts/*.zip
            ${{ env.WS }}/artifacts/variant.json
            ${{ env.WS }}/artifacts/boot.img
            ${{ env.WS }}/artifacts/Image
            ${{ env.WS }}/artifacts/Image.lz4
            ${{ env.WS }}/artifacts/Image.gz
            ${{ env.WS }}/artifacts/System.map
            ${{ env.WS }}/artifacts/build.config.resolved
            ${{ env.WS }}/artifacts/modules.builtin*

      - name: Upload vmlinux and modules separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algiz-debug-${{ github.run_number }}-${{ matrix.variant }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ env.WS }}/artifacts/vmlinux.zst
            ${{ env.WS }}/artifacts/vmlinux.symvers
            ${{ env.WS }}/artifacts/modules/**

      - name: Summary
        if: always()
        working-directory: ${{ env.WS }}
        env:
          MODE: ${{ inputs.mode || 'user' }}
          BUILD_SCOPE: ${{ inputs.build_scope || 'image' }}
        run: |
          set -uo pipefail
          {
            echo "## algiz kernel - \`${VARIANT}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Variant | \`${VARIANT}\` — ${VARIANT_LABEL} |"
            echo "| Kernel | \`${KVER:-unknown}\` |"
            echo "| MTK mode | \`$MODE\` |"
            echo "| Scope | \`$BUILD_SCOPE\` |"
            echo "| AK3 zip | \`${ZIPNAME:-not built}\` |"
            if [ -f artifacts/boot.img ]; then
              echo "| boot.img | repacked from your stock image |"
            else
              echo "| boot.img | not built (no stock boot.img supplied) |"
            fi
            echo
            echo "The release is cut once, by the \`release\` job, after all"
            echo "variants finish."
            echo
            echo "### Artifacts"
            echo '```'
            ls -lh artifacts 2>/dev/null || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Disk usage (diagnostics)
        if: always()
        run: df -h / /mnt || true

  # One release for all variants. This has to be a separate job: the release
  # step used to live inside the build job, which under a matrix would cut one
  # release per variant instead of the single combined release asked for.
  release:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    # always(): a variant that failed must not suppress the release of the ones
    # that succeeded (fail-fast is off above for the same reason). The step
    # below still refuses to publish an empty release.
    if: always() && github.event_name == 'workflow_dispatch' && inputs.publish_release
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: recipe

      - name: Download every variant's artifacts
        uses: actions/download-artifact@v4
        with:
          # Only this run's kernel artifacts; the debug artifacts (vmlinux,
          # ~200 MB compressed per variant) are deliberately not released.
          pattern: algiz-kernel-${{ github.run_number }}-*
          path: dl

      - name: Publish one release with all variants
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODE: ${{ inputs.mode || 'user' }}
          BUILD_SCOPE: ${{ inputs.build_scope || 'image' }}
          WANTED: ${{ needs.plan.outputs.count }}
        run: |
          set -euo pipefail
          stage=/tmp/release
          meta=/tmp/meta
          rm -rf "$stage" "$meta"; mkdir -p "$stage" "$meta"

          # Per-variant files share names (Image, boot.img, ...), so everything
          # except the already-variant-named AK3 zip is prefixed on the way in.
          # variant.json is metadata for the notes, not an asset.
          shopt -s nullglob
          variants=()
          for d in dl/algiz-kernel-*; do
            [ -f "$d/variant.json" ] || { echo "::warning::$d has no variant.json - skipped"; continue; }
            v="$(jq -r .variant "$d/variant.json")"
            echo "::group::$v"
            cp -f "$d/variant.json" "$meta/$v.json"
            for f in "$d"/*; do
              b="${f##*/}"
              case "$b" in
                variant.json) continue ;;
                *.zip)        cp -f "$f" "$stage/$b" ;;
                *)            cp -f "$f" "$stage/${v}-${b}" ;;
              esac
              echo "  $b"
            done
            echo "::endgroup::"
            variants+=("$v")
          done

          [ "${#variants[@]}" -gt 0 ] || {
            echo "::error::no variant produced artifacts - nothing to release"
            exit 1
          }
          echo "staged ${#variants[@]} of ${WANTED} requested variant(s): ${variants[*]}"
          if [ "${#variants[@]}" -lt "$WANTED" ]; then
            echo "::warning::only ${#variants[@]} of ${WANTED} variants built; releasing what exists"
          fi

          # The tag needs the kernel version, which is identical across
          # variants (same source tree, same LOCALVERSION) - take it from the
          # first one and assert the rest agree, so a silent mismatch cannot
          # end up mislabelled.
          kver="$(jq -r .kver "$meta/${variants[0]}.json")"
          for v in "${variants[@]}"; do
            k="$(jq -r .kver "$meta/$v.json")"
            [ "$k" = "$kver" ] || {
              echo "::error::variant $v built kernel $k, expected $kver"
              exit 1
            }
          done
          # The run number keeps two builds on the same day from colliding.
          tag="v${kver}-${GITHUB_RUN_NUMBER}"

          cd "$stage"
          mapfile -t assets < <(ls -1)
          sha256sum -- "${assets[@]}" > SHA256SUMS
          assets+=(SHA256SUMS)
          cat SHA256SUMS
          echo "attaching ${#assets[@]} assets"

          # Invoked through `bash` rather than executed directly: the repo is
          # authored on Windows with core.filemode=false, so a missing exec bit
          # in the index is easy to introduce and would only ever show up here,
          # as Permission denied, after a ~25 minute build.
          jq -s '.' "$meta"/*.json > /tmp/variants.json
          bash "$GITHUB_WORKSPACE/recipe/scripts/release-notes.sh" \
            "$kver" /tmp/variants.json "$MODE" "$BUILD_SCOPE" \
            "$GITHUB_RUN_NUMBER" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > /tmp/notes.md

          gh release create "$tag" \
            --title "algiz kernel ${kver} - ${#variants[@]} variants (build ${GITHUB_RUN_NUMBER})" \
            --notes-file /tmp/notes.md \
            --target "$GITHUB_SHA" \
            "${assets[@]}"

          url="$(gh release view "$tag" --json url --jq .url)"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_URL=$url" >> "$GITHUB_ENV"
          echo "VARIANTS=${variants[*]}" >> "$GITHUB_ENV"
          echo "published $url"

      - name: Verify every asset actually uploaded
        run: |
          set -euo pipefail
          # A GitHub release asset stuck in state "starter" is a truncated
          # upload; it never heals, and the download 404s. gh release create
          # exits 0 regardless, so check explicitly.
          bad="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
                   --jq '.assets[] | select(.state != "uploaded") | .name')"
          [ -z "$bad" ] || { echo "::error::assets not fully uploaded: $bad"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.assets[] | "  \(.state)  \(.size)  \(.name)"'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary
        if: always()
        run: |
          set -uo pipefail
          {
            echo "## algiz kernels - one release, all variants"
            echo
            if [ -n "${RELEASE_URL:-}" ]; then
              echo "Released [\`${RELEASE_TAG}\`](${RELEASE_URL}) with variants: \`${VARIANTS:-}\`"
            else
              echo "No release was published."
            fi
            echo
            echo "| Variant | What it is | Pick it when |"
            echo "|---|---|---|"
            echo "| \`droidspaces-enforcing\` | DroidSpaces + SELinux enforcing | You want DroidSpaces and stock security. Start here. |"
            echo "| \`droidspaces-permissive\` | DroidSpaces + SELinux permissive | Something in a container is blocked by SELinux. |"
            echo "| \`stock-permissive\` | Stock config + SELinux permissive | You do not use DroidSpaces and only need permissive. |"
            echo
            echo "Root is **not** in any of these. Patch \`init_boot.img\` with"
            echo "KernelSU (LKM mode) — see the release notes."
          } >> "$GITHUB_STEP_SUMMARY"
